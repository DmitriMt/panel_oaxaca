[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "panel_oaxaca"
version = "1.0.0"
description = "Kitagawa-Oaxaca-Blinder decomposition for panel and cross-sectional data"
readme = "README.md"
license = {text = "GPL-3.0-only"}
authors = [
    {name = "Dmitri Mt", email = "d.matveev.workmail@gmail.com"},
]
maintainers = [
    {name = "Dmitri Mt"},
]
keywords = [
    "oaxaca", "blinder", "decomposition", "panel data",
    "wage gap", "discrimination", "kitagawa", "longitudinal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Social Science",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.4",
    "linearmodels>=5.0",
    "patsy>=0.5",
]
[project.urls]
Homepage = "https://github.com/DmitriMt/panel_oaxaca"
Repository = "https://github.com/DmitriMt/panel_oaxaca.git"
Bug_Tracker = "https://github.com/DmitriMt/panel_oaxaca/issues"
[tool.setuptools.packages.find]
where = ["."]
include = ["panel_oaxaca*"]
[tool.setuptools.package-data]
panel_oaxaca = ["py.typed"]
[tool.setuptools]
zip-safe = false
[tool.black]
line-length = 88
target-version = ["py310"]
[tool.ruff]
line-length = 88
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "W"]
[tool.pytest.ini_options]
minversion = "7.0"
